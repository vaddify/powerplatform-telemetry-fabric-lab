name: infra

on:
  push:
    branches: [main]
    paths: ['infra/bicep/**', '.github/workflows/infra.yml']
  pull_request:
    branches: [main]
    paths: ['infra/bicep/**', '.github/workflows/infra.yml']

permissions:
  id-token: write
  contents: read

env:
  TEMPLATE: infra/bicep/main.bicep
  PARAMS: infra/bicep/main.bicepparam

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bicep build
        run: az bicep build --file ${{ env.TEMPLATE }}
      - name: Bicep lint
        run: az bicep lint --file ${{ env.TEMPLATE }}

  whatif:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: What-if
        run: |
          az deployment group what-if \
            --resource-group ${{ vars.AZURE_RG }} \
            --template-file ${{ env.TEMPLATE }} \
            --parameters ${{ env.PARAMS }}

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    environment: lab
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy
        run: |
          az deployment group create \
            --resource-group ${{ vars.AZURE_RG }} \
            --template-file ${{ env.TEMPLATE }} \
            --parameters ${{ env.PARAMS }}
